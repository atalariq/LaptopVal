<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" role="img">
  <title>LaptopVal — used laptop deal evaluator</title>
  <desc>Laptop icon with green checkmark badge and LaptopVal wordmark</desc>

  <!-- Laptop screen body -->
  <rect x="0" y="6" width="60" height="40" rx="4" fill="#0C447C"/>
  <!-- Screen inner -->
  <rect x="4" y="10" width="52" height="31" rx="2" fill="#E6F1FB"/>
  <!-- Score bar bg -->
  <rect x="9" y="23" width="42" height="6" rx="3" fill="#B5D4F4"/>
  <!-- Score bar fill -->
  <rect x="9" y="23" width="30" height="6" rx="3" fill="#1D9E75"/>
  <!-- Score text -->
  <text x="30" y="21" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0C447C" text-anchor="middle">78 / 100</text>
  <!-- Hinge -->
  <rect x="0" y="45" width="60" height="3" rx="1" fill="#042C53"/>
  <!-- Base -->
  <rect x="-5" y="47" width="70" height="7" rx="3" fill="#185FA5"/>
  <!-- Trackpad -->
  <rect x="22" y="49" width="16" height="3" rx="1.5" fill="#0C447C" opacity="0.45"/>

  <!-- Checkmark badge -->
  <circle cx="52" cy="11" r="10" fill="#1D9E75"/>
  <path d="M46.5 11 L50 14.5 L57.5 7" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark: Laptop (bold) + Val (regular) -->
  <text x="78" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#0C447C">Laptop</text>
  <text x="199" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="400" fill="#185FA5">Val</text>

  <!-- Tagline -->
  <text x="78" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#888780" letter-spacing="0.06em">used laptop deal evaluator</text>
</svg>
